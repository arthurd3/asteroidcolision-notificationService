# Local infrastructure for both services.
#
# Lives at the repo root because it serves the whole system: it previously sat
# inside the producer module, which has no database, while the MySQL it starts
# belongs to the consumer.
#
# Copy .env.example to .env first - MYSQL_* and the app credentials are read from
# there rather than hardcoded.

services:
  mysql:
    image: mysql:8.4
    container_name: asteroid-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-asteroidalerting}
      MYSQL_USER: ${MYSQL_USER:-asteroid}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    ports:
      - "3306:3306"
    volumes:
      # single mount: the old file mapped the same named volume at both
      # /var/lib/mysql and /var/log/mysql
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Single-node KRaft broker. ZooKeeper is gone: Kafka 4 removed it, and
  # spring-kafka's test broker is KRaft-only now, so keeping it locally only
  # meant dev and test disagreed.
  kafka:
    image: apache/kafka:4.2.1
    container_name: asteroid-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: asteroid-alerting-local-01
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  kafka-ui:
    # pinned: this was :latest, so the tool could change under you between runs
    image: kafbat/kafka-ui:v1.5.0
    container_name: asteroid-kafka-ui
    restart: unless-stopped
    ports:
      - "8084:8080"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"

# The Confluent schema-registry container is gone. It was running on port 8083
# and nothing in either service ever talked to it - there is no Avro or Protobuf
# anywhere, the topic carries JSON.

volumes:
  db-data:
